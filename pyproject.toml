[project]
name = "lossgog"
version = "0.1.1"
description = "GOG display characterization with perceptual color difference loss functions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "colour-science>=0.4",
    "matplotlib>=3.10",
    "pandas>=2.3",
    "scipy>=1.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "rich>=14.2.0",
]
